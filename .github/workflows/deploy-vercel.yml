---
name: Deploy Vercel

"on":
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: |
          npm run lint
          npm test
          npm run build

      - name: Check Vercel credentials
        id: vercel-secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing Vercel secrets. Preview deploy steps will be skipped."
          fi

      - name: Pull Vercel preview environment
        if: steps.vercel-secrets.outputs.ready == 'true'
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel preview deployment
        if: steps.vercel-secrets.outputs.ready == 'true'
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview to Vercel
        if: steps.vercel-secrets.outputs.ready == 'true'
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  production:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: |
          npm run lint
          npm test
          npm run build

      - name: Check Vercel credentials
        id: vercel-secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing Vercel secrets. Production deploy steps will be skipped."
          fi

      - name: Pull Vercel production environment
        if: steps.vercel-secrets.outputs.ready == 'true'
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production deployment
        if: steps.vercel-secrets.outputs.ready == 'true'
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production to Vercel
        if: steps.vercel-secrets.outputs.ready == 'true'
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
